<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duck Hunt</title>
    <style>
      /* Silkscreen — used only for the countdown (avoids the '1' top-flag artifact) */
      @font-face {
        font-family: 'Silkscreen';
        src: url('./fonts/Silkscreen-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Silkscreen';
        src: url('./fonts/Silkscreen-Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      /* Press Start 2P — primary pixel font for HUD, lobby, end screen */
      @font-face {
        font-family: 'Press Start 2P';
        src: url('./fonts/PressStart2P-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --font-pixel: 'Press Start 2P', monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      /* --- UPRAVENÁ ČÁST PRO CENTROVÁNÍ --- */
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: var(--font-pixel);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #game-container canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      /* ------------------------------------ */

      /* HTML overlay (lobby, countdown, end, HUD) */
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        font-family: var(--font-pixel);
        color: #fff;
        z-index: 10;
      }
      #overlay > * {
        pointer-events: auto;
      }
      .hidden {
        display: none !important;
      }

      /* HUD */
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 80px;
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 8px 16px;
        pointer-events: none;
        z-index: 20;
        border-bottom: 4px solid #000;
      }
      .score-box {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border: 3px solid #000;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.4);
        color: #fff;
        font-size: 18px;
        transition: filter 0.2s, transform 0.2s;
      }
      .score-box.joined {
        filter: none;
      }
      .score-box.not-joined {
        filter: grayscale(1) brightness(0.4);
      }
      .score-box.bump {
        transform: scale(1.18);
      }
      .score-color {
        width: 24px;
        height: 24px;
        border: 2px solid #000;
        border-radius: 2px;
      }
      #timer {
        font-size: 32px;
        color: #fff;
        background: #000;
        padding: 8px 16px;
        border: 3px solid #fff;
        min-width: 80px;
        text-align: center;
      }

      /* Lobby */
      #lobby {
        position: fixed;
        top: 80px;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding-top: 8px;
        background: rgba(0, 0, 0, 0.0);
        pointer-events: none; /* clicks pass through to canvas */
      }
      #lobby > * { pointer-events: auto; }
      #lobby .start-btn { pointer-events: auto; }
      #lobby h1 {
        font-size: 88px;
        color: #fff;
        text-align: center;
        text-shadow:
          -6px 0 0 #000, 0 -6px 0 #000, 6px 0 0 #000, 0 6px 0 #000,
          -6px -6px 0 #000, 6px -6px 0 #000, -6px 6px 0 #000, 6px 6px 0 #000;
        letter-spacing: 8px;
        margin: 0 0 32px 0;
      }
      #lobby .subtitle {
        font-size: 20px;
        color: #fff;
        opacity: 0.95;
        text-align: center;
        text-shadow:
          -3px 0 0 #000, 0 -3px 0 #000, 3px 0 0 #000, 0 3px 0 #000,
          -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000;
        margin-bottom: 24px;
      }
      #lobby .start-btn {
        font-family: var(--font-pixel);
        font-size: 32px;
        padding: 16px 40px;
        background: #fdd835;
        color: #000;
        border: 4px solid #000;
        cursor: pointer;
        text-transform: uppercase;
        box-shadow: 4px 4px 0 #000;
        transition: transform 0.1s;
        margin-top: auto;
        margin-bottom: 18vh;
      }
      #lobby .start-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 #000;
      }
      #lobby .start-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #000;
      }
      #lobby .start-btn.hidden {
        display: none;
      }
      #lobby .ready-indicator {
        position: absolute;
        font-size: 16px;
        padding: 6px 14px;
        border: 3px solid #000;
        color: #fff;
        text-shadow:
          -2px 0 0 #000, 0 -2px 0 #000, 2px 0 0 #000, 0 2px 0 #000,
          -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
        transform: translate(-50%, 0);
        display: none;
        pointer-events: none;
      }
      #lobby .ready-indicator.show {
        display: block;
      }

      /* Countdown */
      #countdown {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Silkscreen', monospace;
        font-size: 220px;
        color: #fff;
        background: rgba(0, 0, 0, 0.4);
        text-shadow: 8px 8px 0 #000;
        z-index: 30;
        pointer-events: none;
      }

      /* End screen */
      #end-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        pointer-events: none;
      }
      #end-screen > * { pointer-events: auto; }
      #end-screen h1 {
        font-size: 64px;
        text-shadow: 4px 4px 0 #000;
        letter-spacing: 4px;
      }
      #scoreboard {
        display: flex;
        flex-direction: column;
        gap: 12px;
        font-size: 22px;
        color: #fff;
      }
      .scoreboard-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 24px;
        border: 3px solid #000;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
      }
      .scoreboard-row .name {
        min-width: 140px;
      }
      .scoreboard-row .score {
        margin-left: auto;
        min-width: 40px;
        text-align: right;
      }
      .scoreboard-row.winner {
        background: #fdd835;
        color: #000;
        text-shadow: 2px 2px 0 #fff;
      }
      .scoreboard-row .swatch {
        width: 28px;
        height: 28px;
        border: 2px solid #000;
      }
      #replay-btn {
        font-family: var(--font-pixel);
        font-size: 28px;
        padding: 14px 36px;
        background: #43a047;
        color: #fff;
        border: 4px solid #000;
        cursor: pointer;
        text-transform: uppercase;
        box-shadow: 4px 4px 0 #000;
        margin-top: 16px;
      }
      /* Make sure all overlay headings inherit white */
      #end-screen h1 { color: #fff; }
    </style>

  </head>
  <body>
    <div id="game-container"></div>

    <!-- HUD (always present, populated during play) -->
    <div id="hud" class="hidden">
      <div class="score-box not-joined" data-color="0">
        <div class="score-color" style="background: #e53935"></div>
        <span class="score-value">0</span>
      </div>
      <div class="score-box not-joined" data-color="1">
        <div class="score-color" style="background: #fdd835"></div>
        <span class="score-value">0</span>
      </div>
      <div id="timer">60</div>
      <div class="score-box not-joined" data-color="2">
        <div class="score-color" style="background: #43a047"></div>
        <span class="score-value">0</span>
      </div>
      <div class="score-box not-joined" data-color="3">
        <div class="score-color" style="background: #1e88e5"></div>
        <span class="score-value">0</span>
      </div>
    </div>

    <!-- Lobby -->
    <div id="lobby" class="hidden">
      <h1>DUCK HUNT</h1>
      <div class="subtitle">SHOOT YOUR COLOR TO JOIN</div>
      <div class="ready-indicator" data-color="0">READY</div>
      <div class="ready-indicator" data-color="1">READY</div>
      <div class="ready-indicator" data-color="2">READY</div>
      <div class="ready-indicator" data-color="3">READY</div>
      <button class="start-btn hidden" data-action="start">START</button>
    </div>

    <!-- Countdown -->
    <div id="countdown" class="hidden"></div>

    <!-- End screen -->
    <div id="end-screen" class="hidden">
      <h1>TIME'S UP!</h1>
      <div id="scoreboard"></div>
      <button id="replay-btn" data-action="replay">PLAY AGAIN</button>
    </div>

  </body>
</html>
